# `make e2e-recorded`: a developer's recorded exchanges, mounted read-only where
# the plugin's sample data replays them from, under its storage
# (__main__.py's RECORDED). RECORDED_DIR is the directory RECORDED names,
# absolute; never committed.
services:
  kraken:
    volumes:
      - ${RECORDED_DIR:?make e2e-recorded exports RECORDED_DIR}:/var/lib/meridian/storage/recorded:ro
