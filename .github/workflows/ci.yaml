# CI is confirmation, not the first place a failure is found. The pre-push hook
# runs `make ci-local` locally, so a red run here means the hook was bypassed
# or the runner differs from a developer's machine -- both worth knowing.
#
# The job is named for the make target it runs. It runs ci-remote rather than
# ci-local: check.yaml takes `make check`'s steps and e2e.yaml `make e2e`'s
# (which builds the plugin's image), and suite-same needs meridian-coinbase
# checked out beside this repository, which the runner has not.
#
# Red until open-meridian 0.22.0 (contract v18) is on PyPI: its containers
# install the pinned SDK from there, and find no such release yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make ci-remote
        run: make ci-remote
