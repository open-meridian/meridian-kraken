# The plugin proven against a released runtime, on every push and pull
# request: `make e2e` runs it in synthetic mode, on the plugin harness the
# Makefile pins beside its runtime image, with the e2e's reader beside it
# (e2e/run.py says each step). No secret: the images pull without a token,
# and synthetic mode asks nothing of Kraken.
#
# The job is named for the make target that runs it locally: `make e2e`, part
# of ci-local and so of the pre-push hook.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: make e2e
        run: make e2e
      # What the harness's components and runner printed, kept when it fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: .e2e/*.log
          if-no-files-found: ignore
